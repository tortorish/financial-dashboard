<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>金融数据看板 | Financial Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <style>
        :root {
            --bg: #0d1117;
            --bg-card: #161b22;
            --bg-hover: #1c2128;
            --border: #30363d;
            --text: #c9d1d9;
            --text-muted: #8b949e;
            --text-bright: #f0f6fc;
            --accent: #58a6ff;
            --accent-dim: #1f6feb;
            --up: #3fb950;
            --up-bg: rgba(63, 185, 80, 0.1);
            --down: #f85149;
            --down-bg: rgba(248, 81, 73, 0.1);
            --warning: #d29922;
            --radius: 12px;
            --shadow: 0 4px 24px rgba(0,0,0,0.4);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.5;
        }
        .container { max-width: 1400px; margin: 0 auto; padding: 24px; }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 28px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
        }
        .header-left { display: flex; align-items: center; gap: 16px; }
        .header h1 {
            font-size: 26px;
            font-weight: 700;
            color: var(--text-bright);
            letter-spacing: -0.5px;
        }
        .header .subtitle { font-size: 13px; color: var(--text-muted); margin-top: 2px; }
        .header .status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--text-muted);
            background: var(--bg-card);
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid var(--border);
        }
        .status-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: var(--up);
            animation: pulse 2s infinite;
        }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

        .btn-group { display: flex; gap: 10px; flex-wrap: wrap; }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 9px 18px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg-card);
            color: var(--text);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .btn:hover { background: var(--bg-hover); border-color: var(--accent); }
        .btn:active { transform: scale(0.97); }
        .btn.primary { background: var(--accent-dim); border-color: var(--accent-dim); color: #fff; }
        .btn.primary:hover { background: var(--accent); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn svg { width: 14px; height: 14px; }

        .category { margin-bottom: 28px; }
        .category-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 15px;
            font-weight: 600;
            color: var(--text-bright);
            margin-bottom: 14px;
            padding-left: 8px;
            border-left: 3px solid var(--accent);
        }
        .category-count {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-muted);
            background: var(--bg-card);
            padding: 2px 8px;
            border-radius: 10px;
            border: 1px solid var(--border);
        }

        .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 18px;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
        }
        .card:hover {
            transform: translateY(-2px);
            border-color: var(--accent);
            box-shadow: var(--shadow);
        }
        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
        }
        .card.up::before { background: var(--up); }
        .card.down::before { background: var(--down); }
        .card.neutral::before { background: var(--warning); }
        .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
        .card-name { font-size: 15px; font-weight: 600; color: var(--text-bright); }
        .card-symbol { font-size: 11px; color: var(--text-muted); font-family: monospace; margin-top: 2px; }
        .card-badge {
            font-size: 11px;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 6px;
        }
        .card-badge.up { background: var(--up-bg); color: var(--up); }
        .card-badge.down { background: var(--down-bg); color: var(--down); }

        .card-price { font-size: 24px; font-weight: 700; color: var(--text-bright); margin-bottom: 4px; }
        .card-price .unit { font-size: 13px; font-weight: 500; color: var(--text-muted); margin-left: 4px; }
        .card-change { font-size: 13px; font-weight: 500; margin-bottom: 12px; }
        .card-change.up { color: var(--up); }
        .card-change.down { color: var(--down); }

        .card-metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .metric { font-size: 12px; }
        .metric-label { color: var(--text-muted); }
        .metric-value { color: var(--text); font-weight: 500; }
        .metric-value.up { color: var(--up); }
        .metric-value.down { color: var(--down); }

        .card-footer {
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px solid var(--border);
            font-size: 11px;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
        }
        .card-error { color: var(--down); font-size: 12px; margin-top: 8px; }
        .card-hint { font-size: 11px; color: var(--text-muted); margin-top: 8px; font-style: italic; }

        .loading-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(13,17,23,0.85);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            z-index: 2000;
            backdrop-filter: blur(4px);
        }
        .loading-overlay.hidden { display: none; }
        .spinner {
            width: 40px; height: 40px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text { margin-top: 16px; font-size: 14px; color: var(--text-muted); }

        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            display: none;
            align-items: center; justify-content: center;
            z-index: 1500;
            padding: 20px;
            backdrop-filter: blur(6px);
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            width: 100%; max-width: 1000px;
            max-height: 90vh;
            display: flex; flex-direction: column;
            box-shadow: var(--shadow);
            animation: modalIn 0.25s ease;
        }
        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .modal-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 18px 24px;
            border-bottom: 1px solid var(--border);
        }
        .modal-title { font-size: 18px; font-weight: 600; color: var(--text-bright); }
        .modal-close {
            width: 32px; height: 32px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 18px;
            transition: all 0.2s;
        }
        .modal-close:hover { background: var(--down-bg); color: var(--down); border-color: var(--down); }
        .modal-body { padding: 20px 24px; flex: 1; overflow: auto; }
        .modal-controls {
            display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap;
            align-items: center;
        }
        .period-btn {
            padding: 6px 14px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text-muted);
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .period-btn:hover { border-color: var(--accent); color: var(--text); }
        .period-btn.active { background: var(--accent-dim); border-color: var(--accent-dim); color: #fff; }
        .data-source-badge {
            margin-left: auto;
            font-size: 11px;
            color: var(--text-muted);
            background: var(--bg);
            padding: 4px 10px;
            border-radius: 6px;
            border: 1px solid var(--border);
        }
        #klineChart { width: 100%; height: 420px; }
        .kline-info {
            display: flex; gap: 20px; margin-top: 12px;
            font-size: 12px; color: var(--text-muted);
            flex-wrap: wrap;
        }
        .kline-info span { display: inline-flex; align-items: center; gap: 4px; }
        .no-data-msg {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
            font-size: 14px;
        }

        .toast {
            position: fixed; bottom: 24px; right: 24px;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            z-index: 3000;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s;
            box-shadow: var(--shadow);
        }
        .toast.show { transform: translateY(0); opacity: 1; }
        .toast.success { background: var(--up-bg); color: var(--up); border: 1px solid rgba(63,185,80,0.3); }
        .toast.error { background: var(--down-bg); color: var(--down); border: 1px solid rgba(248,81,73,0.3); }

        @media (max-width: 768px) {
            .header { flex-direction: column; align-items: flex-start; }
            .cards { grid-template-columns: 1fr; }
            #klineChart { height: 300px; }
            .modal { max-height: 95vh; }
        }
    </style>
</head>
<body>
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
        <div class="loading-text" id="loadingText">加载数据中...</div>
    </div>

    <div class="container">
        <div class="header">
            <div class="header-left">
                <div>
                    <h1>金融数据看板</h1>
                    <div class="subtitle">实时追踪中美科技 & 半导体指数</div>
                </div>
                <div class="status" id="connStatus">
                    <span class="status-dot"></span>
                    <span>数据源: 腾讯FiT</span>
                </div>
            </div>
            <div class="btn-group">
                <button class="btn primary" id="btnRefresh" onclick="refreshQuotes()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
                    刷新行情
                </button>
            </div>
        </div>

        <!-- US Broad -->
        <div class="category">
            <div class="category-title">
                美股大盘
                <span class="category-count" id="count-us_broad">0/2</span>
            </div>
            <div class="cards" id="cards-us_broad"></div>
        </div>

        <!-- US Chip -->
        <div class="category">
            <div class="category-title">
                美股半导体
                <span class="category-count" id="count-us_chip">0/2</span>
            </div>
            <div class="cards" id="cards-us_chip"></div>
        </div>

        <!-- CN Tech -->
        <div class="category">
            <div class="category-title">
                中国科技
                <span class="category-count" id="count-cn_tech">0/4</span>
            </div>
            <div class="cards" id="cards-cn_tech"></div>
        </div>

        <!-- CN Chip -->
        <div class="category">
            <div class="category-title">
                中国芯片
                <span class="category-count" id="count-cn_chip">0/3</span>
            </div>
            <div class="cards" id="cards-cn_chip"></div>
        </div>

        <!-- HK Tech -->
        <div class="category">
            <div class="category-title">
                港股科技
                <span class="category-count" id="count-hk_tech">0/1</span>
            </div>
            <div class="cards" id="cards-hk_tech"></div>
        </div>
    </div>

    <!-- K-line Modal -->
    <div class="modal-overlay" id="klineModal">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-title" id="modalTitle">K线图</div>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="modal-controls">
                    <button class="period-btn" data-period="3m" onclick="switchPeriod('3m')">3个月</button>
                    <button class="period-btn" data-period="6m" onclick="switchPeriod('6m')">6个月</button>
                    <button class="period-btn active" data-period="1y" onclick="switchPeriod('1y')">1年</button>
                    <button class="period-btn" data-period="3y" onclick="switchPeriod('3y')">3年</button>
                    <span class="data-source-badge" id="dataSourceBadge">数据来源</span>
                </div>
                <div id="klineChart"></div>
                <div class="kline-info" id="klineInfo"></div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        let quotesData = [];
        let currentModalIndex = null;
        let currentPeriod = '1y';
        let chartInstance = null;

        const CATEGORIES = ['us_broad','us_chip','cn_tech','cn_chip','hk_tech'];
        const PERIOD_LABELS = { '3m':'近3个月', '6m':'近6个月', '1y':'近1年', '3y':'近3年' };
        const SOURCE_LABELS = { 'yahoo':'Yahoo Finance', 'tencent':'腾讯自选股', 'neodata':'NeoData', 'unknown':'未知' };

        function showLoading(text) {
            document.getElementById('loadingText').textContent = text;
            document.getElementById('loadingOverlay').classList.remove('hidden');
        }
        function hideLoading() {
            document.getElementById('loadingOverlay').classList.add('hidden');
        }
        function showToast(msg, type='success') {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = 'toast ' + type;
            requestAnimationFrame(() => t.classList.add('show'));
            setTimeout(() => t.classList.remove('show'), 3000);
        }
        function formatNum(n) {
            if (!n) return '--';
            let s = String(n).replace(/,/g,'');
            let f = parseFloat(s);
            if (isNaN(f)) return n;
            if (Math.abs(f) >= 1e8) return (f/1e8).toFixed(2) + '亿';
            if (Math.abs(f) >= 1e4) return (f/1e4).toFixed(2) + '万';
            return f.toLocaleString('zh-CN', {maximumFractionDigits: 2});
        }
        function parseChange(v) {
            if (!v) return 0;
            let f = parseFloat(String(v).replace('%','').replace('+',''));
            return isNaN(f) ? 0 : f;
        }
        function changeClass(v) {
            const f = parseChange(v);
            if (f > 0) return 'up';
            if (f < 0) return 'down';
            return 'neutral';
        }
        function sign(v) {
            const f = parseChange(v);
            return f > 0 ? '+' : '';
        }

        function renderCards(indices) {
            quotesData = indices;
            CATEGORIES.forEach(cat => {
                const container = document.getElementById('cards-' + cat);
                const items = indices.filter(i => i.category === cat);
                const okCount = items.filter(i => i.status === 'ok').length;
                document.getElementById('count-' + cat).textContent = okCount + '/' + items.length;

                container.innerHTML = items.map(idx => {
                    if (idx.status === 'error') {
                        return `<div class="card neutral" onclick="openKline('${idx.id}')"><div class="card-header"><div><div class="card-name">${idx.name}</div><div class="card-symbol">${idx.symbol || ''}</div></div></div><div class="card-error">获取失败: ${(idx.error||'').substring(0,60)}</div><div class="card-hint">点击尝试查看历史数据</div></div>`;
                    }
                    if (idx.status === 'no_data') {
                        return `<div class="card neutral" onclick="openKline('${idx.id}')"><div class="card-header"><div><div class="card-name">${idx.name}</div><div class="card-symbol">${idx.symbol || ''}</div></div></div><div class="card-error">暂无行情数据</div></div>`;
                    }
                    const cls = changeClass(idx.changePct);
                    const ytdCls = changeClass(idx.ytd);
                    const unit = (idx.price || '').includes('点') ? '' : ((idx.symbol||'').endsWith('.US') ? 'USD' : ((idx.symbol||'').endsWith('.HK') ? 'HKD' : ''));
                    const priceVal = (idx.price || '').replace(/点/g,'').trim();
                    return `<div class="card ${cls}" onclick="openKline('${idx.id}')"><div class="card-header"><div><div class="card-name">${idx.name}</div><div class="card-symbol">${idx.symbol || ''}</div></div><span class="card-badge ${cls}">${sign(idx.changePct)}${idx.changePct || '0.00%'}</span></div><div class="card-price">${priceVal}<span class="unit">${unit}</span></div><div class="card-change ${cls}">${sign(idx.changePct)}${idx.changePct || '0.00%'} 今日</div><div class="card-metrics"><div class="metric"><span class="metric-label">开盘</span><div class="metric-value">${idx.open || '--'}</div></div><div class="metric"><span class="metric-label">最高</span><div class="metric-value">${idx.high || '--'}</div></div><div class="metric"><span class="metric-label">最低</span><div class="metric-value">${idx.low || '--'}</div></div><div class="metric"><span class="metric-label">昨收</span><div class="metric-value">${idx.prevClose || '--'}</div></div><div class="metric"><span class="metric-label">年初至今</span><div class="metric-value ${ytdCls}">${sign(idx.ytd)}${idx.ytd || '--'}</div></div><div class="metric"><span class="metric-label">20日涨跌</span><div class="metric-value ${changeClass(idx.change20d)}">${sign(idx.change20d)}${idx.change20d || '--'}</div></div></div><div class="card-footer"><span>成交量: ${formatNum(idx.volume)}</span><span>${idx.updateTime || ''}</span></div></div>`;
                }).join('');
            });
        }

        async function fetchQuotes() {
            const btn = document.getElementById('btnRefresh');
            btn.disabled = true;
            try {
                const resp = await fetch('/api/indices');
                const data = await resp.json();
                if (data.indices) renderCards(data.indices);
                return data;
            } catch (e) {
                showToast('行情获取失败: ' + e.message, 'error');
                throw e;
            } finally {
                btn.disabled = false;
            }
        }
        async function refreshQuotes() {
            showLoading('刷新行情中...');
            try {
                await fetchQuotes();
                showToast('行情刷新成功');
            } catch (e) {
                showToast('刷新失败', 'error');
            } finally {
                hideLoading();
            }
        }

        async function openKline(indexId) {
            currentModalIndex = indexId;
            const idx = quotesData.find(i => i.id === indexId);
            document.getElementById('modalTitle').textContent = (idx ? idx.name : indexId) + ' - 趋势图';
            document.getElementById('klineModal').classList.add('active');
            await loadAndRenderChart(indexId, currentPeriod);
        }
        function closeModal() {
            document.getElementById('klineModal').classList.remove('active');
            if (chartInstance) { chartInstance.dispose(); chartInstance = null; }
        }
        async function switchPeriod(p) {
            currentPeriod = p;
            document.querySelectorAll('.period-btn').forEach(b => b.classList.toggle('active', b.dataset.period === p));
            if (currentModalIndex) await loadAndRenderChart(currentModalIndex, p);
        }

        async function loadAndRenderChart(indexId, period) {
            showLoading('加载K线数据...');
            try {
                const resp = await fetch(`/api/kline/${indexId}?period=${period}`);
                const data = await resp.json();
                hideLoading();
                if (data.error) {
                    showToast(data.error, 'error');
                    renderNoData('数据加载失败');
                    return;
                }
                renderChart(data);
            } catch (e) {
                hideLoading();
                showToast('K线加载失败: ' + e.message, 'error');
                renderNoData('网络错误');
            }
        }

        function renderNoData(msg) {
            const dom = document.getElementById('klineChart');
            if (chartInstance) chartInstance.dispose();
            chartInstance = null;
            dom.innerHTML = `<div class="no-data-msg">${msg}<br><span style="font-size:12px;color:#8b949e">该品种可能暂不支持K线图展示</span></div>`;
            document.getElementById('klineInfo').innerHTML = '';
            document.getElementById('dataSourceBadge').textContent = '数据来源: 无';
        }

        function renderChart(data) {
            const dom = document.getElementById('klineChart');
            dom.innerHTML = '';
            if (chartInstance) chartInstance.dispose();
            chartInstance = echarts.init(dom, 'dark');

            const records = data.records || [];
            const source = data.source || 'unknown';
            document.getElementById('dataSourceBadge').textContent = '数据来源: ' + (SOURCE_LABELS[source] || source);

            if (!records.length) {
                renderNoData('暂无K线数据');
                return;
            }

            const dates = records.map(r => r.date);
            const klineValues = records.map(r => [
                parseFloat(r.open) || 0,
                parseFloat(r.close) || 0,
                parseFloat(r.low) || 0,
                parseFloat(r.high) || 0,
            ]);
            const volumes = records.map(r => parseFloat(r.volume) || 0);
            const upColor = '#3fb950';
            const downColor = '#f85149';
            const colors = klineValues.map(v => v[1] >= v[0] ? upColor : downColor);

            const option = {
                backgroundColor: 'transparent',
                animation: true,
                tooltip: {
                    trigger: 'axis',
                    axisPointer: { type: 'cross' },
                    backgroundColor: 'rgba(22,27,34,0.95)',
                    borderColor: '#30363d',
                    textStyle: { color: '#c9d1d9', fontSize: 12 },
                    formatter: function(params) {
                        const d = params[0];
                        const rec = records[d.dataIndex];
                        return `<div style="font-weight:600;margin-bottom:4px">${d.name}</div>
                                <div>开: ${rec.open}</div>
                                <div>收: <span style="color:${rec.close>=rec.open?upColor:downColor}">${rec.close}</span></div>
                                <div>高: ${rec.high}</div>
                                <div>低: ${rec.low}</div>
                                <div>量: ${formatNum(rec.volume)}</div>`;
                    }
                },
                grid: [
                    { left: '10%', right: '8%', top: '10%', height: '58%' },
                    { left: '10%', right: '8%', top: '72%', height: '16%' }
                ],
                xAxis: [
                    {
                        type: 'category', data: dates, scale: true, boundaryGap: false,
                        axisLine: { lineStyle: { color: '#30363d' } },
                        axisLabel: { color: '#8b949e', fontSize: 11 },
                        splitLine: { show: false },
                        min: 'dataMin', max: 'dataMax',
                        axisPointer: { label: { backgroundColor: '#161b22' } }
                    },
                    {
                        type: 'category', gridIndex: 1, data: dates, scale: true, boundaryGap: false,
                        axisLine: { lineStyle: { color: '#30363d' } },
                        axisLabel: { show: false }, splitLine: { show: false },
                        axisPointer: { label: { backgroundColor: '#161b22' } }
                    }
                ],
                yAxis: [
                    {
                        scale: true,
                        splitArea: { show: true, areaStyle: { color: ['rgba(255,255,255,0.02)', 'rgba(255,255,255,0)'] } },
                        axisLine: { lineStyle: { color: '#30363d' } },
                        axisLabel: { color: '#8b949e', fontSize: 11 },
                        splitLine: { lineStyle: { color: '#21262d' } }
                    },
                    {
                        scale: true, gridIndex: 1, splitNumber: 2,
                        axisLabel: { show: false }, axisLine: { show: false },
                        axisTick: { show: false }, splitLine: { show: false }
                    }
                ],
                dataZoom: [
                    { type: 'inside', xAxisIndex: [0,1], start: 0, end: 100 },
                    { type: 'slider', xAxisIndex: [0,1], start: 0, end: 100, height: 20, bottom: 10,
                      borderColor: '#30363d', fillerColor: 'rgba(88,166,255,0.15)',
                      handleStyle: { color: '#58a6ff' }, textStyle: { color: '#8b949e' } }
                ],
                series: [
                    {
                        name: 'K线', type: 'candlestick', data: klineValues,
                        itemStyle: {
                            color: upColor, color0: downColor,
                            borderColor: upColor, borderColor0: downColor
                        }
                    },
                    {
                        name: '成交量', type: 'bar', xAxisIndex: 1, yAxisIndex: 1,
                        data: volumes.map((v,i) => ({value: v, itemStyle: {color: colors[i]}})),
                    }
                ]
            };
            chartInstance.setOption(option);

            const first = records[0];
            const last = records[records.length-1];
            const firstClose = parseFloat(first.close);
            const lastClose = parseFloat(last.close);
            const totalChg = firstClose ? ((lastClose - firstClose) / firstClose * 100).toFixed(2) : '0.00';
            const chgColor = totalChg >= 0 ? upColor : downColor;
            const chgSign = totalChg >= 0 ? '+' : '';
            document.getElementById('klineInfo').innerHTML = `
                <span>数据点数: ${records.length}</span>
                <span>起始: ${first.date} ${first.close}</span>
                <span>结束: ${last.date} ${last.close}</span>
                <span style="color:${chgColor}">区间涨跌: ${chgSign}${totalChg}%</span>
            `;
        }

        document.getElementById('klineModal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeModal();
        });
        window.addEventListener('resize', () => {
            if (chartInstance) chartInstance.resize();
        });

        async function init() {
            showLoading('加载行情中...');
            try {
                await fetchQuotes();
            } catch (e) {
                showToast('初始加载失败，请刷新重试', 'error');
            } finally {
                hideLoading();
            }
        }
        init();
    </script>
</body>
</html>
